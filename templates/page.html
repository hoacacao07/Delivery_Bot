<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content=""width=device-width, initial-sacle=-1">
    <title>Bot Control</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; }
        button { width: 110px; height: 80px; font-size: 20px; margin: 6px; }
    </style>
</head>
<body>
    <h1>Delivery Bot Control</h1>
    <div><button onclick="send('forward')">Forward</button></div>
    <div>
        <button onclick="send('left')">Left</button>
        <button onclick="send('stop')">STOP</button>
        <button onclick="send('right')">Right</button>
    </div>
    <div><button onclick="send('backward')">Back</button></div>
    <div id="status">Ready</div>
    <script>
        async function send(cmd) {
            const r = await fetch('/move/' + cmd);
            document.getElementById('status').innerText = await r.text();
        }
    </script>
</body>
</html>
